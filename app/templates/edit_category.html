{% extends "layout.html" %}
{% block content %}
    <h1>Edit Category</h1>
        <form action="{{ url_for('category.edit_category', category_id=category.id) }}" method="post">
        <label class="form-label" for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ category.name }}" class="form-control" required>

        <input type="submit" value="Update Category" class="btn btn-success mt-3">
    </form>
{% endblock %}
