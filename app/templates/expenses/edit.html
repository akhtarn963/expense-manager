{% extends "layouts/base.html" %}
{% block content %}
    <h1>Edit Expense</h1>
        <form action="{{ url_for('expense.edit_expense', expense_id=expense.id) }}" method="post">
            <label class="form-label" for="category_id">Category:</label>
            <select id="category_id" name="category_id" class="form-select" required>
                <option value="">Select a category</option>
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if expense.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>
        <label class="form-label" for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ expense.title }}" class="form-control" required>
        <label class="form-label" for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" value="{{ expense.amount }}" class="form-control" required>
        <label class="form-label" for="expense_date">Date:</label>
        <input type="date" id="expense_date" name="expense_date" class="form-control" value="{{ expense.expense_date }}" required>

        <input type="submit" value="Update Expense" class="btn btn-success mt-3">
    </form>
{% endblock %}
