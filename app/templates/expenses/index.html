{% extends "layouts/base.html" %}
{% block content %}
    <h1>Expesnes</h1>   
    
    <a class="btn btn-primary mb-3 mt-3 float-end" href="{{ url_for('expense.add_expense') }}">Add Expense</a>
    <table class="table table-striped table-hover">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        {% for expense in expenses %}
        <tr>
            <td>{{ expense.id }}</td>
            <td>{{ expense.title }}</td>
            <td>{{ format_money(expense.amount) }}</td>
            <td>{{ expense.category.name }}</td>
            <td>
                <span class="badge {{ expense.status_class }}">
                    {{ expense.status }}
                </span>
            </td>
            <td>
                <form action="{{ url_for('expense.edit_expense', expense_id=expense.id) }}" method="get" style="display:inline;">
                    <input class="btn btn-warning btn-sm" type="submit" value="Edit">
                </form>
                <form action="{{ url_for('expense.delete_expense', expense_id=expense.id) }}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this expense?');">
                    <input class="btn btn-danger btn-sm" type="submit" value="Delete">
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
    
{% endblock %}
