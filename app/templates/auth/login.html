{% extends "layouts/base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card mt-4">
            <div class="card-header">
                <h3>Login</h3>
            </div>

            <div class="card-body">

                <form method="POST">
                        <div class="mb-3">
                        <label>Email</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Password</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>
                    </div>

                    <button class="btn btn-primary">
                        Login
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>
<p class="text-center mt-3">
    Don't have an account?
    <a href="{{ url_for('auth.register') }}">Register</a>
</p>

{% endblock %}
