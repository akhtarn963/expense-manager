{% extends "layouts/base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
    <h1>Profile</h1>
    <div class="row">
        <div class="card col-md-6">
            <div class="card-body">
                <p><strong>Name:</strong> {{ g.user.name }}</p>
                <p><strong>Email:</strong> {{ g.user.email }}</p>
                <a type="button" class="btn btn-primary" href="{{ url_for('profile.edit_profile') }}">Edit Profile</a>
            </div>
        </div>
        <div class="card col-md-4" style="margin-left: 50px;">
            <div class="card-body">
                <h2>Change Password</h2>
                <a type="button" class="btn btn-secondary" href="{{ url_for('profile.change_password') }}">Change Password</a>
            </div>
        </div>
    </div>

    {% endblock %}
