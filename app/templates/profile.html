{% extends "layout.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
    <h1>Profile</h1>
    <p><strong>Name:</strong> {{ g.user.name }}</p>
    <p><strong>Email:</strong> {{ g.user.email }}</p>
    <a type="button" class="btn btn-primary" href="{{ url_for('expense.edit_profile') }}">Edit Profile</a>


    <h2 class="mt-4">Change Password</h2>
    <form method="POST" action="{{ url_for('expense.change_password') }}">
        <div class="form-group">
            <label for="old_password">Old Password</label>
            <input type="password" class="form-control" id="old_password" name="old_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" class="form-control" id="new_password" name="new_password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
        </div><br>
        <button type="submit" class="btn btn-primary">Change Password</button>


    {% endblock %}
