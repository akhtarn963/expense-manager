{% extends "layouts/base.html" %}
{% block content %}
    <h1>Categories</h1>   
    
    <div class="clearfix"></div>
    <a class="btn btn-primary mb-3 mt-3 float-end" href="{{ url_for('category.add_category') }}">Add Category</a>
    <table class="table table-striped table-hover">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Action</th>
        </tr>
        {% for category in categories %}
        <tr>
            <td>{{ category.id }}</td>
            <td>{{ category.name }}</td>
            <td>
                <form action="{{ url_for('category.edit_category', category_id=category.id) }}" method="get" style="display:inline;">
                    <input class="btn btn-warning btn-sm" type="submit" value="Edit">
                </form>
                <form action="{{ url_for('category.delete_category', category_id=category.id) }}" method="post" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this category?');">
                    <input class="btn btn-danger btn-sm" type="submit" value="Delete">
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
    
{% endblock %}
