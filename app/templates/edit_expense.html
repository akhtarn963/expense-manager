{% extends "layout.html" %}
{% block content %}
    <h1>Edit Expense</h1>
        <form action="{{ url_for('expense.edit_expense', expense_id=expense.id) }}" method="post">
        <label class="form-label" for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ expense.title }}" class="form-control" required>
        <label class="form-label" for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" value="{{ expense.amount }}" class="form-control" required>

        <input type="submit" value="Update Expense" class="btn btn-success mt-3">
    </form>
{% endblock %}
